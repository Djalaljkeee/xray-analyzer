name: log-analyzer

# Этот файл используется на каждой Xray ноде для запуска агента
# Скопируйте на каждую ноду и создайте .env файл с настройками

services:
  # Default pulls from GitHub Container Registry. Upgrade flow on each node:
  #   docker compose -f docker-compose.agent.yml pull && \
  #   docker compose -f docker-compose.agent.yml up -d
  # Build locally instead:  add --build to the `up` command.
  # Pin a tag:               ANALYZER_IMAGE_TAG=v1.2.3 in .env
  xray-log-agent:
    image: ghcr.io/djalaljkeee/xray-analyzer/agent:${ANALYZER_IMAGE_TAG:-latest}
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: xray-log-agent
    restart: unless-stopped
    user: root
    volumes:
      # Монтируем директорию с логами Remnanode
      - ${LOG_HOST_PATH:-/var/log/remnanode}:/var/log/remnanode:ro
    environment:
      # Уникальный ID этой ноды (любая строка)
      - NODE_ID=${NODE_ID:-node-1}
      # Путь к access логу внутри контейнера
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/var/log/remnanode/access.log}
      # URL сервера анализа
      - SERVER_URL=${SERVER_URL:-wss://analyzer.example.com/ws}
      # Размер батча (количество записей)
      - BATCH_SIZE=${BATCH_SIZE:-1000}
      # Таймаут батча
      - BATCH_TIMEOUT=${BATCH_TIMEOUT:-5s}
      # Токен аутентификации (должен совпадать с AGENT_TOKEN на сервере)
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    # Для работы с inotify нужен доступ к fs
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # Ограничение ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
