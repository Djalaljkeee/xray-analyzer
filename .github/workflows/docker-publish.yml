name: Publish Docker images

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths:
      - "server/**"
      - "agent/**"
      - ".github/workflows/docker-publish.yml"
      - "docker-compose*.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ghcr.io paths are case-insensitive but conventionally lowercase.
  # github.repository (Djalaljkeee/xray-analyzer) is lowercased below.
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build:
    name: Build & push ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: ./server
            dockerfile: ./server/Dockerfile
          - component: agent
            context: ./agent
            dockerfile: ./agent/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image namespace
        id: ns
        run: |
          echo "namespace=$(echo '${{ env.IMAGE_NAMESPACE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.namespace }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build (and push on non-PR events)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # amd64-only for now. arm64 via QEMU emulation breaks `npm ci`
          # in the web-builder stage because @next/swc and lightningcss
          # ship platform-specific musl binaries that are flaky under
          # QEMU. To re-enable arm64, switch web-builder/go-builder to
          # `--platform=$BUILDPLATFORM` and cross-compile to $TARGETARCH.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false
